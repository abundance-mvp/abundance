# Sourcery Configuration for Abundance iOS App
# Version: 2.3.0+ (Swift 6.2 compatible)
# Created: 2025-11-11
# Stage: 4.1 - iOS Project Scaffolding
# References:
#   - docs/design/CODEGEN-001-sourcery-templates.md (AutoMockable template)
#   - docs/validation/RESEARCH-VALIDATION-stage-4.1.md (Sourcery 2.3.0+ verified)

# MARK: - Source Paths

sources:
  - Packages/Features/CatalogFeature/Sources
  - Packages/Features/CameraFeature/Sources
  - Packages/Features/OnboardingFeature/Sources
  - Packages/Features/ProfileFeature/Sources
  - Packages/Core/Models/Sources
  - Packages/Core/Networking/Sources
  - Packages/Core/Firebase/Sources
  - Packages/Core/Vision/Sources
  - Packages/Core/Persistence/Sources
  - Packages/Shared/Components/Sources
  - Packages/Shared/Extensions/Sources
  - Packages/Shared/Constants/Sources

# MARK: - Template Paths

templates:
  - Templates/AutoMockable.stencil

# MARK: - Output Path

output:
  path: Generated/Mocks/
  link:
    project: Abundance.xcodeproj
    target: AbundanceTests

# MARK: - Arguments

args:
  # Enable verbose output for debugging
  verbose: true

# MARK: - Configuration

config:
  # Swift language version (6.2 for Swift 6 support)
  language: swift-6.2

  # Parsing options
  parseDocumentation: false  # Skip documentation parsing for faster generation
  trimWhiteSpace: true       # Remove trailing whitespace

# MARK: - Annotations

# Protocols annotated with `// sourcery: AutoMockable` will generate mocks

# Example:
#   // sourcery: AutoMockable
#   protocol CatalogRepository: Sendable {
#       func fetchItems() async throws -> [CatalogItem]
#   }
#
# Generates:
#   class MockCatalogRepository: CatalogRepository {
#       var fetchItemsCalled = false
#       var fetchItemsReturnValue: [CatalogItem]!
#       func fetchItems() async throws -> [CatalogItem] {
#           fetchItemsCalled = true
#           return fetchItemsReturnValue
#       }
#   }

# MARK: - Usage Instructions

# Run Sourcery:
#   sourcery --config Sourcery.yml             # Generate code
#   sourcery --config Sourcery.yml --watch     # Watch mode (regenerate on changes)
#   sourcery --config Sourcery.yml --verbose   # Verbose output

# CI/CD:
#   sourcery --config Sourcery.yml --disableCache  # Force regeneration

# Xcode Integration:
#   Add Run Script Phase (before Compile Sources):
#     if which sourcery >/dev/null; then
#       sourcery --config Sourcery.yml
#     else
#       echo "warning: Sourcery not installed, install via: brew install sourcery"
#     fi

# MARK: - Template Location

# Create Templates/AutoMockable.stencil with content from CODEGEN-001:
#   mkdir -p Templates
#   # Copy AutoMockable.stencil template from CODEGEN-001-sourcery-templates.md
