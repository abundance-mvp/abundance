name: Abundance
options:
  bundleIdPrefix: com.abundance
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: NDAMNXP7RA
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_STRICT_CONCURRENCY_CHECKING: YES
    SWIFT_UPCOMING_FEATURE_FLAGS: StrictConcurrency

targets:
  Abundance:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    settings:
      base:
        PRODUCT_NAME: Abundance
        PRODUCT_BUNDLE_IDENTIFIER: com.abundance.mvp
        CODE_SIGN_ENTITLEMENTS: Abundance.entitlements
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: NDAMNXP7RA
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

    sources:
      - path: App
        name: App
        type: group
        excludes:
          - "Info.plist"

    resources:
      - App/Assets.xcassets
      - App/GoogleService-Info.plist
      - Sources/VisionCore/Resources/yolo11n.mlmodelc

    entitlements:
      path: Abundance.entitlements

    dependencies:
      - package: Abundance
        product: Core
      - package: Abundance
        product: VisionCore
      - package: Abundance
        product: Persistence
      - package: Abundance
        product: OnboardingFeature
      - package: Abundance
        product: CameraFeature
      - package: Abundance
        product: InventoryFeature
      - package: Abundance
        product: ProfileFeature

packages:
  Abundance:
    path: .
