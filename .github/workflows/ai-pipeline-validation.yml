name: AI Pipeline Validation

on:
  pull_request:
    paths:
      - 'backend/ai-pipeline/**'
      - 'docs/tech-stack/ai-*.json'
      - '.github/workflows/ai-pipeline-validation.yml'
  push:
    branches: [main]

jobs:
  validate:
    name: Validate AI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/ai-pipeline/package-lock.json

      - name: Install dependencies
        working-directory: backend/ai-pipeline
        run: npm ci

      - name: TypeScript build
        working-directory: backend/ai-pipeline
        run: npm run build

      - name: Run tests
        working-directory: backend/ai-pipeline
        run: npm test

      - name: Validate cost model
        run: |
          # Ensure cost tracking types are valid
          npm run validate-types
