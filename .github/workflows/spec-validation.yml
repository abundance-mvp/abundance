name: Spec Validation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/spec-validation.yml'
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links
        run: |
          # Find all markdown files (excluding docs/archive/)
          find docs -path docs/archive -prune -o -name "*.md" -type f -print | while read file; do
            echo "Checking $file for broken links..."
            # Extract markdown links [text](path)
            grep -oP '\[.*?\]\(\K[^)]+' "$file" | while read link; do
              # Skip external URLs
              if [[ $link == http* ]]; then
                continue
              fi
              # Resolve relative paths with normalization
              dir=$(dirname "$file")
              target=$(realpath -m "$dir/$link" 2>/dev/null)
              if [[ ! -f "$target" ]]; then
                echo "ERROR: Broken link in $file: $link (resolved to $target)"
                exit 1
              fi
            done
          done

      - name: Validate ADR numbering
        run: |
          # Check for duplicate ADR numbers (excluding docs/archive/)
          find docs/adr -path docs/archive -prune -o -name "ADR-*.md" -type f -print | \
            sed 's/.*ADR-\([0-9]\+\).*/\1/' | \
            sort | uniq -d | while read dup; do
              echo "ERROR: Duplicate ADR number: $dup"
              exit 1
            done

      - name: Check DESIGN doc cross-references
        run: |
          # Ensure all DESIGN docs reference at least one ADR (excluding docs/archive/)
          find docs/design -path docs/archive -prune -o -name "DESIGN-*.md" -type f -print | while read file; do
            if ! grep -q "ADR-[0-9]\+" "$file"; then
              echo "WARNING: $file does not reference any ADRs"
            fi
          done
