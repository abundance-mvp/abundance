name: Spec Validation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/spec-validation.yml'
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links
        run: python3 scripts/validate_doc_references.py

      - name: Validate ADR numbering
        run: |
          # Check for duplicate ADR numbers (excluding docs/archive/)
          find docs/adr -path docs/archive -prune -o -name "ADR-*.md" -type f -print | \
            sed 's/.*ADR-\([0-9]\+\).*/\1/' | \
            sort | uniq -d | while read dup; do
              echo "ERROR: Duplicate ADR number: $dup"
              exit 1
            done

      - name: Check doc freshness
        continue-on-error: true
        run: |
          python3 scripts/check_doc_freshness.py || echo "Stale docs detected (non-blocking)"

      - name: Check DESIGN doc cross-references
        run: |
          # Ensure all DESIGN docs reference at least one ADR (excluding docs/archive/)
          find docs/design -path docs/archive -prune -o -name "DESIGN-*.md" -type f -print | while read file; do
            if ! grep -q "ADR-[0-9]\+" "$file"; then
              echo "WARNING: $file does not reference any ADRs"
            fi
          done
