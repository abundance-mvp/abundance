name: Backend Validation

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/tech-stack/firestore.rules'
      - 'docs/tech-stack/storage.rules'
      - '.github/workflows/backend-validation.yml'
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install dependencies
        working-directory: backend/functions
        run: npm ci

      - name: TypeScript build
        working-directory: backend/functions
        run: npm run build

      - name: Run tests
        working-directory: backend/functions
        run: npm test

      - name: Lint Firestore rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --dry-run

      - name: Lint Storage rules
        run: firebase deploy --only storage:rules --dry-run
