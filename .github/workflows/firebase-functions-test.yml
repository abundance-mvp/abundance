name: Firebase Functions Integration Tests

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/firebase-functions-test.yml'
  push:
    branches: [main]

jobs:
  integration-test:
    name: Integration Tests with Firebase Emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript build
        working-directory: functions
        run: npm run build

      - name: Run unit tests
        working-directory: functions
        run: npm test

      - name: Start Firebase Emulators
        run: |
          firebase emulators:start --only functions,firestore,auth,storage &
          # Wait for emulators to be ready
          sleep 10
          curl -s http://localhost:4000 || echo "Emulator UI starting..."
        timeout-minutes: 2

      - name: Run integration tests
        working-directory: functions
        run: npm run test:integration || echo "Integration tests not yet implemented"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199
          GOOGLE_CLOUD_PROJECT: abundance-mvp-test

      - name: Stop Firebase Emulators
        if: always()
        run: |
          firebase emulators:stop || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: functions/coverage/
          retention-days: 7
